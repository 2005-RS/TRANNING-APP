<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="app-id" content="training-app" />
    <meta name="theme-color" content="#060607" />
    <title>Training Platform</title>
    <meta
      name="description" data-seo-default
      content="Personal training plans, nutrition plans, progress tracking and a coach who follows every step — in one experience."
    />
    <meta property="og:type" data-seo-default content="website" />
    <meta property="og:site_name" data-seo-default content="Training Platform" />
    <meta property="og:title" data-seo-default content="Training Platform — Train. Fuel. Evolve." />
    <meta
      property="og:description" data-seo-default
      content="Personal training plans, nutrition plans, progress tracking and a coach who follows every step — in one experience."
    />
    <meta property="og:image" data-seo-default content="/landing/og-cover.jpg" />
    <meta property="og:image:width" data-seo-default content="1200" />
    <meta property="og:image:height" data-seo-default content="630" />
    <meta name="twitter:card" data-seo-default content="summary_large_image" />
    <script>
      (function () {
        try {
          var themeStored = localStorage.getItem('training-platform-theme');
          var theme = themeStored === 'light' || themeStored === 'dark' || themeStored === 'system' ? themeStored : 'dark';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
          var language = localStorage.getItem('UI_LANGUAGE');
          document.documentElement.lang = language === 'es' ? 'es' : 'en';
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
