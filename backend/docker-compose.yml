name: backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-training}
      POSTGRES_USER: ${POSTGRES_USER:-training}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - training_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # minio/minio and minio/mc were deleted from Docker Hub, and quay.io requires
    # credentials. Chainguard publishes the same MinIO server, but only under
    # :latest, so there is no immutable tag to pin. Used for local development and
    # CI only; production points at managed S3-compatible storage.
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trainingminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio-local}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - training_minio_data:/data
    healthcheck:
      # The image ships no curl or wget, so the probe speaks HTTP over the bash
      # TCP device. MinIO answers 400 without a Host header, so it must be 1.1.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r status <&3;
          [[ $$status == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    environment:
      # mc reads the alias from the environment, which avoids needing a shell to
      # run `mc alias set` first. A password with URL-reserved characters has to
      # be percent-encoded here.
      MC_HOST_local: http://${MINIO_ROOT_USER:-trainingminio}:${MINIO_ROOT_PASSWORD:-changeme-minio-local}@minio:9000
    # New buckets are private, so no anonymous policy is applied.
    command: ["mb", "--ignore-existing", "local/${OBJECT_STORAGE_BUCKET:-training-exercise-media}"]

volumes:
  training_postgres_data:
  training_minio_data:
